# loomhand fork: daily, main follows trycua/cua main and dev is rebased onto it; a conflict opens an issue.
# Only main and dev move; the upstream PR branches (fix/*) and cmgs/* are never touched.
name: "Fork: Upstream sync"

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  issues: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

env:
  UPSTREAM: https://github.com/trycua/cua.git
  FORK_WORKFLOWS: fork-ci.yml fork-dev-release.yml fork-upstream-sync.yml

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout dev
        uses: actions/checkout@v7.0.1
        with:
          ref: dev
          fetch-depth: 0
          token: ${{ secrets.UPSTREAM_SYNC_TOKEN || github.token }}

      - name: Fast-forward main to upstream
        run: |
          set -eu
          git fetch --quiet "$UPSTREAM" main
          upstream=$(git rev-parse FETCH_HEAD)
          git push origin "$upstream:refs/heads/main"
          echo "UPSTREAM_SHA=$upstream" >> "$GITHUB_ENV"

      - name: Rebase dev onto main
        id: rebase
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          old=$(git rev-parse HEAD)
          if [ "$(git merge-base HEAD "$UPSTREAM_SHA")" = "$UPSTREAM_SHA" ]; then
            echo "dev already sits on $UPSTREAM_SHA"
            exit 0
          fi
          if ! git rebase "$UPSTREAM_SHA"; then
            git diff --name-only --diff-filter=U > "$RUNNER_TEMP/conflicts"
            git rebase --abort
            echo "conflict=true" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          git push --force-with-lease="dev:$old" origin HEAD:dev

      - name: Open an issue on conflict
        if: failure() && steps.rebase.outputs.conflict == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          title="Upstream sync: dev does not rebase onto trycua/cua ${UPSTREAM_SHA:0:9}"
          if [ -z "$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "Upstream sync: dev does not rebase in:title" --json number --jq '.[].number')" ]; then
            { echo "The daily sync could not rebase dev onto trycua/cua \`$UPSTREAM_SHA\`. main was fast-forwarded; dev is unchanged."
              echo
              echo "Conflicting files:"
              sed 's/^/- /' "$RUNNER_TEMP/conflicts"
              echo
              echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            } > "$RUNNER_TEMP/body"
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file "$RUNNER_TEMP/body"
          fi

      - name: Keep upstream workflows disabled
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          gh workflow list --repo "$GITHUB_REPOSITORY" --all --json id,path,state --jq '.[] | select(.state == "active") | "\(.id) \(.path)"' |
            while read -r id path; do
              case " $FORK_WORKFLOWS " in *" ${path##*/} "*) ;; *) gh workflow disable "$id" --repo "$GITHUB_REPOSITORY" ;; esac
            done

      - name: Build the new dev
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run fork-ci.yml --repo "$GITHUB_REPOSITORY" --ref dev
          gh workflow run fork-dev-release.yml --repo "$GITHUB_REPOSITORY" --ref dev
